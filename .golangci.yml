linters:
  enable:
  - errcheck
  - govet
  - staticcheck
  - ineffassign
  - unused
  - misspell 
  - unconvert
  - revive
  - gocritic
  - nilerr
  - nolintlint
  - wastedassign

linters-settings:
  misspell:
    locale: US

issues:
  exclude-dirs:
    - migrations
    - testdata

run:
  timeout: 5m
